# These tasks should only be used by GH actions

[tools]
python = "3.14"
uv = "latest"
pre-commit = "latest"

[tasks.install-ci]
description = "Install dependencies for CI"
run = "uv sync --all-packages --all-extras --dev"

[tasks.pre-commit-ci]
description = "Run pre-commit hooks (CI only)"
run = "pre-commit run --all-files"

[tasks.build-lambda]
description = "Install a package and its dependencies into dist/<package> for the Lambda zip"
usage = '''
arg "<package>" help="Package to build the Lambda contents for"
'''
run = '''
OUTPUT_DIR="dist/${usage_package}"
rm -rf "$OUTPUT_DIR"
uv pip install \
    --target "$OUTPUT_DIR" \
    --python python3.14 \
    "./packages/${usage_package}"
'''

[tasks.test-ci]
description = "Run tests with coverage in CI for a specific package"
usage = '''
arg "[package]" help="Package to run tests for"
'''
run = '''
if [ -z "${usage_package:-}" ]; then
    echo "Error: No package specified. Please provide a package name." >&2
    exit 1
fi
if [ ! -d "packages/${usage_package}/tests" ]; then
    echo "No tests directory for ${usage_package}, skipping"
    exit 0
fi
echo "Running tests for package: ${usage_package}"
uv run --package ${usage_package} coverage run -m pytest "packages/${usage_package}/tests"
uv run --package ${usage_package} coverage report --fail-under=80
'''
